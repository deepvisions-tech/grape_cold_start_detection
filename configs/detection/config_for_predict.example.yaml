# Detector prediction/relabeling configuration.
PREDICT_MODEL_PATH: /path/to/model_best.pt
PREDICT_IMAGE_DIR: /path/to/unlabeled_images
PREDICT_OUTPUT_DIR: /path/to/predicted_yolo_dataset

PREDICT_DEVICE: "0"
PREDICT_IMGSZ: 960
PREDICT_CONF: 0.25
PREDICT_IOU: 0.7
PREDICT_MAX_DET: 300
PREDICT_BATCH: 16
PREDICT_FP16: true
PREDICT_SAVE_CONF: false
PREDICT_RESET_OUTPUT_DIR: false
PREDICT_DISABLE_TQDM: false

# Optional class subset. Empty means all model classes.
PREDICT_CLASSES:

# Optional tiled inference.
PREDICT_TILED_INFER_ENABLED: false
PREDICT_TILED_MERGE_IOU: 0.7
PREDICT_TILED_SELECT_BOX_FROM_MIDDLE: 0.5
PREDICT_MAX_OVERLAP_RATIO:

# Optional validation-tuned confidence.
PREDICT_USE_F1_OPTIMIZED_CONF: false
PREDICT_AUTO_TUNE_F1_CONF_IF_MISSING: false
PREDICT_OVERWRITE_F1_OPTIMIZED_CONF: false
PREDICT_TUNE_SPLIT_DIR:
PREDICT_TUNE_SPLIT: val
PREDICT_TUNE_TARGET_GT_CLASS: 0
PREDICT_TUNE_CONF_MIN: 0.01
PREDICT_TUNE_CONF_MAX: 0.99
PREDICT_TUNE_CONF_STEP: 0.01

# Optional AdaBN.
PREDICT_ADABN_ENABLED: false
PREDICT_ADABN_IMAGE_DIR:
PREDICT_ADABN_BATCH:
PREDICT_ADABN_IMGSZ:
PREDICT_ADABN_MAX_IMAGES:
PREDICT_ADABN_EPOCHS: 1
PREDICT_ADABN_MAX_STAGE:
PREDICT_ADABN_RESET_STATS: false
PREDICT_ADABN_MOMENTUM: use_original
PREDICT_ADABN_FP16: false
