# Generation-source comparison, 15 matched seeds; no AdaBN (Section 5.3).
# Run separately for background-edited and prompt-only generated data.
# Set 03's dataset/saved split and 06's TEST_TUNE_SPLIT_DIR to the same source.
# For the prompt-only run, change both prefixes below to
# grape_generation_prompt_only_15_seed to retain the edited-source outputs.
# Run: grape-detector-seed-sweep --config configs/reproduction/11_seed_sweep_generation_ablation.yaml

BASE_TRAIN_CONFIG_PATH: configs/reproduction/03_synthetic_only_train.yaml
BASE_TEST_CONFIG_PATH: configs/reproduction/06_evaluate_curated_mix_no_adabn.yaml
SEED_SWEEP_MODE: full
SEED_SWEEP_OUTPUT_DIR: /path/to/seed_sweeps
SEED_SWEEP_TRAIN_RUN_NAME_PREFIX: grape_generation_editing_15_seed
SEED_SWEEP_TEST_RUN_NAME_PREFIX: grape_generation_editing_15_seed
SEED_SWEEP_TRAIN_SEEDS: [111, 222, 333, 444, 555, 666, 777, 888, 999, 1111, 1424, 1679, 2289, 8935, 9674]
SEED_SWEEP_MODEL_WEIGHT_SOURCE: best
SEED_SWEEP_CLEAN_RUN_WEIGHTS_AFTER_EXPORT: false
SEED_SWEEP_REUSE_SHARED_SPLIT: true
SEED_SWEEP_SHARED_SPLIT_DIR:
SEED_SWEEP_SHARED_YAML_PATH:
SEED_SWEEP_DEVICE: "0"
SEED_SWEEP_CONTINUE_ON_ERROR: false
