[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grape-cold-start-detection-yolo"
version = "0.1.0"
description = "Ultralytics detector training, evaluation, seed sweeps, and relabeling"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "ultralytics==8.4.60",
  "numpy==1.26.4",
  "opencv-python==4.10.0.82",
  "pillow==12.2.0",
  "pycocotools==2.0.11",
  "pyyaml==6.0.3",
  "tqdm==4.67.3",
]

[project.scripts]
grape-detector-train = "grape_detector.cli:train"
grape-detector-evaluate = "grape_detector.cli:evaluate"
grape-detector-predict = "grape_detector.cli:predict"
grape-detector-seed-sweep = "grape_detector.cli:seed_sweep"

[tool.setuptools.packages.find]
where = ["."]
include = ["grape_detector", "grape_detector.*"]
namespaces = false
